<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doruri ai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .full {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .full_train {
            width: 100vw;
            height: 200vh;
            position: absolute;
            left: 0px;
        }

        .one_hundred_vw {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div class="full">
        <button class="up_button">up</button>
        <button>down</button>
        <div class="full_train">
            <section class="one_hundred_vw" style="background-color: aqua;"></section>
            <section class="one_hundred_vw" style="background-color: rgb(129, 79, 221);"></section>
        </div>
    </div>
</body>

</html>
