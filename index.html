<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doruri ai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .full {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .up_button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
        }

        .down_button {
            position: fixed;
            top: 40px;
            left: 20px;
            z-index: 2;
        }

        .full_train {
            width: 100vw;
            height: 200vh;
            position: absolute;
            top: 0px;
            left: 0px;
            transition: all 0.6s ease 0s;
        }

        .one_hundred_vw {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div class="full">
        <button class="up_button" onclick="fullTrainUp()">up</button>
        <button class="down_button" onclick="fullTrainDown()">down</button>
        <div class="full_train">
            <section class="one_hundred_vw" style="background-color: aqua;"></section>
            <section class="one_hundred_vw" style="background-color: rgb(129, 79, 221);"></section>
            <section class="one_hundred_vw" style="background-color: rgb(169, 255, 98);"></section>
        </div>
    </div>
    <script>
        let full_train = document.querySelector(".full_train");
        let full_train_top = 0;
        function fullTrainUp() {
            if (full_train_top !== -200) {
                full_train_top -= 100;
                full_train.style.top = `${full_train_top}vh`;
            }
        }
        function fullTrainDown() {
            if (full_train_top !== 0) {
                full_train_top += 100;
                full_train.style.top = `${full_train_top}vh`;
            }
        }
