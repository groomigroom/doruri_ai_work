<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>doruri ai</title>
	<style>
		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Thin.woff2') format('woff2');
			font-weight: 100;
			font-display: swap;
		}

		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2') format('woff2');
			font-weight: 200;
			font-display: swap;
		}

		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Light.woff2') format('woff2');
			font-weight: 300;
			font-display: swap;
		}

		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');
			font-weight: 400;
			font-display: swap;
		}

		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');
			font-weight: 500;
			font-display: swap;
		}

		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2');
			font-weight: 600;
			font-display: swap;
		}

		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');
			font-weight: 700;
			font-display: swap;
		}

		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2') format('woff2');
			font-weight: 800;
			font-display: swap;
		}

		@font-face {
			font-family: 'Pretendard';
			src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Black.woff2') format('woff2');
			font-weight: 900;
			font-display: swap;
		}

		@font-face {
			font-family: 'PretendardVariable';
			src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2611030106@font-variable-694/variable-694/PretendardVariable.woff2') format('woff2');
			font-weight: 45 930;
			font-display: swap;
		}

		/* 가변: font-family: 'PretendardVariable'; font-variation-settings: "wght" 400; */

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			letter-spacing: -0.02em;
			font-family: 'PretendardVariable';
		}

		.full {
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			position: relative;
		}

		.full_train {
			width: 100vw;
			height: 200vh;
			position: absolute;
			top: 0px;
			left: 0px;
			transition: all 0.6s ease 0s;
		}

		.one_hundred_vw {
			width: 100vw;
			height: 100vh;
			position: relative;
			background-color: #fcfcfc;
		}

		.one_hundred_inner {
			width: calc(100vw - 80px);
			height: calc(100vh - 80px);
			position: absolute;
			top: 40px;
			left: 40px;
			border: 5px solid #191919;
			border-radius: 25px;
		}
	</style>
</head>

<body>
	<div class="full">
		<div class="full_train">
			<section class="one_hundred_vw">
				<section class="one_hundred_inner">
					
				</section>
			</section>
			<section class="one_hundred_vw">
				<section class="one_hundred_inner">
					<section class="one_hundred_h2"
						style="width: 100%; height: 65px; display: flex; justify-content: center; align-items: center;">
						<h2 style="font-size: 25px;">▪ 제목 ▪</h2><!--25px로-->
					</section>
					<section class="one_hundred_imgs" style="width: 100%; height: 340px; background-color: aqua;">

					</section>
				</section>
			</section>
			<section class="one_hundred_vw">
				<section class="one_hundred_inner"></section>
			</section>
		</div>
	</div>
	<script>
		let full_train = document.querySelector(".full_train");
		let full_train_top = 0;
		window.addEventListener("keydown", (event) => {
			switch (event.code) {
				case "ArrowUp":
					if (full_train_top !== -200) {
						full_train_top -= 100;
						break;
					} else {
						break;
					}
				case "ArrowDown":
					if (full_train_top !== 0) {
						full_train_top += 100;
						break;
					}
				default:
					return;
			}

			//화살표 키로 화면이 내려가는 현상 방지하기
			event.preventDefault();

			full_train.style.top = `${full_train_top + "vh"}`;
		});
	</script>
</body>

</html>
