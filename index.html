<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doruri ai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .full {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .full_train {
            width: 100vw;
            height: 200vh;
            position: absolute;
            top: 0px;
            left: 0px;
            transition: all 0.6s ease 0s;
        }

        .one_hundred_vw {
            width: 100vw;
            height: 100vh;
			position: relative;
			background-color: #fcfcfc;
        }

		.one_hundred_inner {
			width: calc(100vw - 80px);
			height: calc(100vh - 80px);
			position: absolute;
			top: 40px;
			left: 40px;
			border: 5px solid #191919;
		}
    </style>
</head>

<body>
    <div class="full">
        <div class="full_train">
            <section class="one_hundred_vw">
				<section class="one_hundred_inner"></section>
			</section>
            <section class="one_hundred_vw">
				<section class="one_hundred_inner"></section>
			</section>
            <section class="one_hundred_vw">
				<section class="one_hundred_inner"></section>
			</section>
        </div>
    </div>
    <script>
        let full_train = document.querySelector(".full_train");
        let full_train_top = 0;
		window.addEventListener("keydown", (event) => {
			switch (event.code) {
                case "ArrowUp":
					if (full_train_top !== -200) {
                    	full_train_top -= 100;
                    	break;
					} else {
						break;
					}
                case "ArrowDown":
					if (full_train_top !== 0) {
                    	full_train_top += 100;
                    	break;
					}
                default:
                    return;
            }

            //화살표 키로 화면이 내려가는 현상 방지하기
            event.preventDefault();

            full_train.style.top = `${full_train_top + "vh"}`;
		});
    </script>
</body>

</html>
